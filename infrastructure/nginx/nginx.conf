# ═══════════════════════════════════════════════════════════════════════════════
# Nginx Production Configuration
# WhatsApp SaaS Platform
# ═══════════════════════════════════════════════════════════════════════════════

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logging ─────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ─── Performance ─────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;  # Don't reveal Nginx version

    # ─── Buffer sizes ─────────────────────────────────────────────────────────
    client_body_buffer_size 128k;
    client_max_body_size 50m;    # Must match MAX_UPLOAD_SIZE_MB
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    # ─── Timeouts ────────────────────────────────────────────────────────────
    client_body_timeout 30;
    client_header_timeout 30;
    send_timeout 30;
    proxy_read_timeout 60;
    proxy_connect_timeout 10;
    proxy_send_timeout 60;

    # ─── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ─── Security Headers (applied globally) ──────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ─── Rate Limiting Zones ──────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:20m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=strict:5m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ─── Upstream Definitions ─────────────────────────────────────────────────
    upstream api_backend {
        server api:3001;
        keepalive 64;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    upstream dashboard_backend {
        server dashboard:3000;
        keepalive 32;
    }

    upstream admin_backend {
        server admin:3003;
        keepalive 16;
    }

    # ─── HTTP → HTTPS Redirect ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ─── API Server (api.yourdomain.com) ──────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.yourdomain.com;

        ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:MozSSL:10m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;

        # Connection limits
        limit_conn addr 100;

        # Health check — no rate limit, no auth
        location = /health {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
        }

        # Stripe webhook — no rate limit (Stripe retries on failure)
        location = /v1/billing/webhook {
            proxy_pass http://api_backend;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 30s;
        }

        # Auth endpoints — strict rate limit
        location ~ ^/v1/auth/(login|register|forgot-password) {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://api_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # WebSocket for real-time updates
        location /ws {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;  # 24 hours — persistent connections
            proxy_send_timeout 86400s;
        }

        # All other API endpoints
        location /v1/ {
            limit_req zone=api burst=50 nodelay;
            limit_req_status 429;
            proxy_pass http://api_backend;
            include /etc/nginx/proxy_params.conf;
        }
    }

    # ─── Dashboard (app.yourdomain.com) ───────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name app.yourdomain.com;

        ssl_certificate /etc/letsencrypt/live/app.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.yourdomain.com/privkey.pem;
        ssl_protocols TLSv1.3;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # CSP for dashboard — strict
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.yourdomain.com wss://api.yourdomain.com https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com;" always;

        location / {
            proxy_pass http://dashboard_backend;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 30s;
        }

        # Next.js static files — long cache
        location /_next/static/ {
            proxy_pass http://dashboard_backend;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # ─── Admin Panel (admin.yourdomain.com) ───────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name admin.yourdomain.com;

        ssl_certificate /etc/letsencrypt/live/admin.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.yourdomain.com/privkey.pem;
        ssl_protocols TLSv1.3;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Extra security for admin — IP restriction recommended in production
        # allow YOUR_OFFICE_IP;
        # deny all;

        limit_req zone=strict burst=3 nodelay;

        location / {
            proxy_pass http://admin_backend;
            include /etc/nginx/proxy_params.conf;
        }
    }
}
