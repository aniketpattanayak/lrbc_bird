global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: production
    app: wsaas

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "wsaas-api"
    static_configs:
      - targets: ["api:3001"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: "wsaas-worker"
    static_configs:
      - targets:
          - "worker-1:3002"
          - "worker-2:3002"
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: "wsaas-dispatcher"
    static_configs:
      - targets: ["dispatcher:3004"]
    metrics_path: /metrics

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "node"
    static_configs:
      - targets:
          - "node-exporter-api:9100"
          - "node-exporter-worker:9100"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
