version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    container_name: wsaas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: whatsapp_saas
      POSTGRES_USER: wsaas
      POSTGRES_PASSWORD: localdevpassword
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wsaas -d whatsapp_saas"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - wsaas_network

  redis:
    image: redis:7-alpine
    container_name: wsaas_redis
    restart: unless-stopped
    command: redis-server --requirepass localdevpassword --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "localdevpassword", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wsaas_network

  mailhog:
    image: mailhog/mailhog:latest
    platform: linux/amd64
    container_name: wsaas_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - wsaas_network

  minio:
    image: minio/minio:latest
    container_name: wsaas_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wsaas_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  wsaas_network:
    driver: bridge
    name: wsaas_network
